[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wifipos"
version = "0.1.0"
description = "A modern, cross-platform WiFi fingerprinting-based indoor positioning system"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "wifipos contributors" },
]
keywords = ["wifi", "indoor-positioning", "fingerprinting", "location", "whereami"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Networking",
]
dependencies = [
    "scikit-learn>=1.3.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "joblib>=1.3.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
macos = [
    "pyobjc-framework-CoreWLAN>=9.0",
    "pyobjc-framework-CoreLocation>=9.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
wifipos = "wifipos.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/wifipos"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
